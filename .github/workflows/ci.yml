name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Worker types (Env, KVNamespace, cloudflare:workers) are generated, not
      # committed; the example vars give the secrets their types.
      - name: Generate Cloudflare types
        run: |
          cp .dev.vars.example .dev.vars
          bun run generate-types

      - name: Type check
        run: bunx astro check

      - name: Build
        run: bun run build
